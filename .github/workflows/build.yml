name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Publish (single-file, self-contained)
        run: dotnet publish App/FortniteStats.csproj -c Release -o publish

      - name: Keep only the executable
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item publish/FortniteStats.exe dist/FortniteStats.exe

      - uses: actions/upload-artifact@v4
        with:
          name: FortniteStats-win-x64
          path: dist/FortniteStats.exe

      - name: Create release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/FortniteStats.exe
          generate_release_notes: true
